<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page non trouvée - Pour Senlis en Confiance</title>
    <link rel="icon" type="image/png" href="images/PSEC.png">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-light) 100%);
            color: var(--white);
            text-align: center;
            padding: 2rem;
        }

        .error-content {
            max-width: 600px;
        }

        .error-logo {
            margin-bottom: 2rem;
        }

        .error-logo img {
            width: 120px;
            height: auto;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
            font-family: 'Baloo 2', cursive, sans-serif;
        }

        .error-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-family: 'Baloo 2', cursive, sans-serif;
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .error-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .error-links a {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-green);
            color: var(--white);
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .error-links a:hover {
            background: var(--white);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-logo">
                <a href="/">
                    <img src="images/PSEC.png" alt="Pour Senlis en Confiance">
                </a>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page non trouvée</h1>
            <p class="error-message">
                Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
            </p>

            <div class="error-links">
                <a href="/">Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script>
        // Log 404 for analytics (if implemented)
        if (window.gtag) {
            gtag('event', 'page_not_found', {
                'page_path': window.location.pathname
            });
        }
    </script>
</body>
</html>
