<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Dashboard - Admin Procurations</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/PSEC.png">
    <link rel="apple-touch-icon" href="/images/PSEC.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/css/styles.css?v=20260106b">
</head>
<body class="admin-dashboard-page">
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-header-left">
            <img src="/images/PSEC.png" alt="Logo" class="admin-logo">
            <span class="admin-title">Admin Procurations</span>
        </div>
        <div class="admin-header-right">
            <a href="/admin/liste.html" class="btn-nav">La Liste</a>
            <a href="/admin/strategie.html" class="btn-nav">Stratégie</a>
            <a href="/admin/users.html" class="btn-nav">Utilisateurs</a>
            <span class="admin-user" id="adminUserName"></span>
            <button class="btn-logout" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Tabs -->
        <div class="admin-tabs-container">
            <div class="admin-tabs">
                <button class="admin-tab active" data-type="Mandant">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    Mandants
                    <span class="tab-count" id="mandantCount">0</span>
                </button>
                <button class="admin-tab" data-type="Mandataire">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                    </span>
                    Mandataires
                    <span class="tab-count" id="mandataireCount">0</span>
                </button>
            </div>
            <button class="btn-refresh" id="refreshBtn" title="Rafraîchir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
        </div>

        <!-- Kanban Board -->
        <div class="admin-kanban" id="kanbanBoard">
            <div class="kanban-column" data-status="En attente">
                <div class="kanban-header">
                    <span class="kanban-status-dot status-waiting"></span>
                    En attente
                    <span class="kanban-count" id="countWaiting">0</span>
                </div>
                <div class="kanban-cards" id="cardsWaiting">
                    <!-- Cards will be inserted here -->
                </div>
            </div>

            <div class="kanban-column" data-status="Proposé">
                <div class="kanban-header">
                    <span class="kanban-status-dot status-proposed"></span>
                    Proposé
                    <span class="kanban-count" id="countProposed">0</span>
                </div>
                <div class="kanban-cards" id="cardsProposed">
                    <!-- Cards will be inserted here -->
                </div>
            </div>

            <div class="kanban-column" data-status="Confirmé">
                <div class="kanban-header">
                    <span class="kanban-status-dot status-confirmed"></span>
                    Confirmé
                    <span class="kanban-count" id="countConfirmed">0</span>
                </div>
                <div class="kanban-cards" id="cardsConfirmed">
                    <!-- Cards will be inserted here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Detail Panel (slide-in) -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-panel-header">
            <h2 id="detailName">Nom</h2>
            <button class="detail-close" id="closePanel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="detail-panel-content">
            <div class="detail-type" id="detailType">Mandant</div>

            <div class="detail-section">
                <h3>Contact</h3>
                <div class="detail-info">
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <a href="#" class="detail-value" id="detailEmail"></a>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Téléphone</span>
                        <a href="#" class="detail-value" id="detailPhone"></a>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <h3>Informations</h3>
                <div class="detail-info">
                    <div class="detail-row">
                        <span class="detail-label">Bureau de vote</span>
                        <span class="detail-value" id="detailBureau"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Quartier</span>
                        <span class="detail-value" id="detailQuartier"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Tours</span>
                        <span class="detail-value" id="detailTours"></span>
                    </div>
                    <div class="detail-row" id="detailDateNaissanceRow" style="display: none;">
                        <span class="detail-label">Date de naissance</span>
                        <span class="detail-value" id="detailDateNaissance"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Inscrit le</span>
                        <span class="detail-value" id="detailDate"></span>
                    </div>
                </div>
            </div>

            <div class="detail-section" id="detailMessageSection" style="display: none;">
                <h3>Message</h3>
                <p class="detail-message" id="detailMessage"></p>
            </div>

            <!-- Match Section -->
            <div class="detail-section" id="matchSection">
                <h3>Matches suggérés</h3>
                <div class="match-suggestions" id="matchSuggestions">
                    <div class="match-loading">Chargement...</div>
                </div>
            </div>

            <!-- Current Match Info (if already matched) -->
            <div class="detail-section" id="currentMatchSection" style="display: none;">
                <h3>Match actuel</h3>
                <div class="current-match-info" id="currentMatchInfo"></div>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="detail-overlay" id="detailOverlay"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- JavaScript -->
    <script src="/js/admin.js?v=20260106b"></script>
</body>
</html>
