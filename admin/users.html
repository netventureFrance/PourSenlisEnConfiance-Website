<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Utilisateurs - Admin</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/PSEC.png">
    <link rel="apple-touch-icon" href="/images/PSEC.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/css/styles.css?v=20260106c">
</head>
<body class="admin-dashboard-page">
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-header-left">
            <img src="/images/PSEC.png" alt="Logo" class="admin-logo">
            <span class="admin-title">Gestion Utilisateurs</span>
        </div>
        <div class="admin-header-right">
            <a href="/admin/dashboard.html" class="btn-nav">Procurations</a>
            <span class="admin-user" id="adminUserName"></span>
            <button class="btn-logout" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-content-container">
            <!-- Add User Card -->
            <div class="admin-card-section">
                <h2>Ajouter un utilisateur</h2>
                <form id="addUserForm" class="user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newEmail">Email *</label>
                            <input type="email" id="newEmail" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="newNom">Nom</label>
                            <input type="text" id="newNom" name="nom" placeholder="Optionnel">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newPassword">Mot de passe *</label>
                            <div class="password-input-group">
                                <input type="text" id="newPassword" name="password" required>
                                <button type="button" class="btn-generate" onclick="generatePassword()">Générer</button>
                            </div>
                        </div>
                        <div class="form-group form-actions">
                            <button type="submit" class="btn btn-primary">Ajouter</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Users List -->
            <div class="admin-card-section">
                <h2>Utilisateurs existants</h2>
                <div class="users-list" id="usersList">
                    <div class="loading-text">Chargement...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Password Modal -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Réinitialiser le mot de passe</h3>
                <button class="modal-close" onclick="closeResetModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Utilisateur : <strong id="resetUserEmail"></strong></p>
                <div class="form-group">
                    <label for="resetPassword">Nouveau mot de passe</label>
                    <div class="password-input-group">
                        <input type="text" id="resetPassword">
                        <button type="button" class="btn-generate" onclick="generateResetPassword()">Générer</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeResetModal()">Annuler</button>
                <button class="btn btn-primary" onclick="confirmResetPassword()">Réinitialiser</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // State
        let users = [];
        let resetUserId = null;

        // Auth Check
        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            const user = localStorage.getItem('adminUser');

            if (!token || !user) {
                window.location.href = '/admin/';
                return false;
            }

            try {
                const userData = JSON.parse(user);
                document.getElementById('adminUserName').textContent = userData.nom || userData.email;
            } catch (e) {
                document.getElementById('adminUserName').textContent = 'Admin';
            }

            return true;
        }

        // API Helper
        async function apiCall(endpoint, options = {}) {
            const token = localStorage.getItem('adminToken');
            const defaultHeaders = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };

            const response = await fetch(endpoint, {
                ...options,
                headers: { ...defaultHeaders, ...options.headers }
            });

            if (response.status === 401) {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminUser');
                window.location.href = '/admin/';
                throw new Error('Session expirée');
            }

            return response.json();
        }

        // Loading
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('visible');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('visible');
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('visible'), 10);
            setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Generate Password
        function generatePassword() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            let password = '';
            for (let i = 0; i < 16; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('newPassword').value = password;
        }

        function generateResetPassword() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            let password = '';
            for (let i = 0; i < 16; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('resetPassword').value = password;
        }

        // Fetch Users
        async function fetchUsers() {
            try {
                const data = await apiCall('/.netlify/functions/admin-users');
                if (data.success) {
                    users = data.users;
                    renderUsers();
                }
            } catch (error) {
                console.error('Fetch users error:', error);
                showToast('Erreur lors du chargement', 'error');
            }
        }

        // Render Users
        function renderUsers() {
            const container = document.getElementById('usersList');

            if (users.length === 0) {
                container.innerHTML = '<p class="no-data">Aucun utilisateur</p>';
                return;
            }

            container.innerHTML = users.map(user => `
                <div class="user-card">
                    <div class="user-info">
                        <div class="user-avatar">${(user.nom || user.email)[0].toUpperCase()}</div>
                        <div class="user-details">
                            <strong>${escapeHtml(user.nom || 'Sans nom')}</strong>
                            <span>${escapeHtml(user.email)}</span>
                            ${user.lastLogin ? `<small>Dernière connexion : ${new Date(user.lastLogin).toLocaleDateString('fr-FR')}</small>` : '<small>Jamais connecté</small>'}
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-small btn-secondary" onclick="openResetModal('${user.id}', '${escapeHtml(user.email)}')">
                            Réinitialiser MDP
                        </button>
                        <button class="btn btn-small btn-danger" onclick="deleteUser('${user.id}', '${escapeHtml(user.email)}')">
                            Supprimer
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add User
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('newEmail').value;
            const nom = document.getElementById('newNom').value;
            const password = document.getElementById('newPassword').value;

            showLoading();

            try {
                const result = await apiCall('/.netlify/functions/admin-users', {
                    method: 'POST',
                    body: JSON.stringify({ email, nom, password })
                });

                if (result.success) {
                    showToast('Utilisateur créé !', 'success');
                    document.getElementById('addUserForm').reset();
                    await fetchUsers();
                } else {
                    showToast(result.error || 'Erreur', 'error');
                }
            } catch (error) {
                showToast('Erreur lors de la création', 'error');
            } finally {
                hideLoading();
            }
        });

        // Reset Password Modal
        function openResetModal(userId, email) {
            resetUserId = userId;
            document.getElementById('resetUserEmail').textContent = email;
            document.getElementById('resetPassword').value = '';
            document.getElementById('resetModal').classList.add('visible');
        }

        function closeResetModal() {
            resetUserId = null;
            document.getElementById('resetModal').classList.remove('visible');
        }

        async function confirmResetPassword() {
            const password = document.getElementById('resetPassword').value;

            if (!password) {
                showToast('Veuillez entrer un mot de passe', 'error');
                return;
            }

            showLoading();

            try {
                const result = await apiCall('/.netlify/functions/admin-users', {
                    method: 'PATCH',
                    body: JSON.stringify({ userId: resetUserId, password })
                });

                if (result.success) {
                    showToast('Mot de passe réinitialisé !', 'success');
                    closeResetModal();
                } else {
                    showToast(result.error || 'Erreur', 'error');
                }
            } catch (error) {
                showToast('Erreur lors de la réinitialisation', 'error');
            } finally {
                hideLoading();
            }
        }

        // Delete User
        async function deleteUser(userId, email) {
            if (!confirm(`Supprimer l'utilisateur ${email} ?`)) {
                return;
            }

            showLoading();

            try {
                const result = await apiCall('/.netlify/functions/admin-users', {
                    method: 'DELETE',
                    body: JSON.stringify({ userId })
                });

                if (result.success) {
                    showToast('Utilisateur supprimé', 'success');
                    await fetchUsers();
                } else {
                    showToast(result.error || 'Erreur', 'error');
                }
            } catch (error) {
                showToast('Erreur lors de la suppression', 'error');
            } finally {
                hideLoading();
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/admin/';
        });

        // Init
        if (checkAuth()) {
            fetchUsers();
        }
    </script>
</body>
</html>
